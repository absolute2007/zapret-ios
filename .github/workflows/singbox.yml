name: sing-box rule-set

# Regenerates singbox/zapret-domains.json from the Flowseal lists every day,
# so the remote sing-box profile picks up list changes automatically.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate
        run: python3 scripts/gen_singbox.py singbox
      - name: Commit if changed
        run: |
          if git diff --quiet -- singbox; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add singbox
          git commit -m "sing-box rule-set: sync with Flowseal lists"
          git push
